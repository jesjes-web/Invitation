    /* Royal Blue Disney Princess Backdrop & Shimmering Textures */
    body {
      background:

      overflow-x: hidden;
      min-height: 100vh;

    /* Fine silk-cotton royal ivory cardstock grain */
    .paper-texture {
      background-color: #F8FAFF;
      background-image:
        radial-gradient(rgba(212, 175, 55, 0.08) 1px, transparent 0),
        radial-gradient(rgba(22, 53, 122, 0.05) 1px, transparent 0);

      width: 100%;
      height: 100%;

      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
    }

      transform: translateY(-7px) rotateX(4deg);
    }
